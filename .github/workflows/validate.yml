name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     - name: Confirm required planning documents exist
  run: |
    echo "Checking for required Part 1 files..."

    test -f ERD.pdf && echo "Found ERD.pdf" || (echo "Missing ERD.pdf" && exit 1)
    test -f APIEndpointPlan.pdf && echo "Found APIEndpointPlan.pdf" || (echo "Missing APIEndpointPlan.pdf" && exit 1)
    test -f RaceDayDatabase.sql && echo "Found RaceDayDatabase.sql" || (echo "Missing RaceDayDatabase.sql" && exit 1)
    test -f README.md && echo "Found README.md" || (echo "Missing README.md" && exit 1)

    echo "All required files are present."
